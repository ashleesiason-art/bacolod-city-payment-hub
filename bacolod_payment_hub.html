<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bacolod City Payment Hub</title>
<style>
:root{--bg:#0a0a0a;--panel:#151522;--purple:#8b21f8;--lav:#c084fc;--muted:#b3b3c3;--line:#38334c}*{box-sizing:border-box}body{margin:0;background:#292630;color:#fff;font:16px Arial,sans-serif;display:flex;justify-content:center}.kiosk{width:min(100%,520px);min-height:100vh;background:var(--bg);padding:24px;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #292433;padding-bottom:16px;font-size:12px}header b{color:var(--lav)}main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px 0}footer{border-bottom:0;border-top:1px solid #292433;padding-top:16px;color:#777486;font-size:10px}.kicker{font-size:11px;letter-spacing:2px;color:var(--lav);font-weight:bold}h1{font-size:40px;line-height:1.08;margin:0}h2{font-size:27px;margin:0}p{color:var(--muted);line-height:1.5;font-size:14px}.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#a855f7,#4c1d95);display:grid;place-items:center;font-size:34px;font-weight:bold}.btn{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;color:#fff;text-align:left;font-size:15px;font-weight:bold;cursor:pointer;min-height:56px}.primary{background:var(--purple);border-color:var(--purple);text-align:center;width:100%}.ghost{text-align:center;width:100%;background:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:130px}.tile i{font-style:normal;font-size:24px;display:block;margin-bottom:12px}.sub{display:block;color:var(--muted);font-size:12px;font-weight:normal;margin-top:5px}.field{display:grid;gap:7px;font-size:13px;font-weight:bold}input,select{background:#10101b;border:1px solid var(--line);border-radius:10px;padding:15px;color:#fff;font-size:15px}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.amount{background:var(--panel);border:1px solid var(--line);color:#fff;padding:14px 4px;border-radius:10px;cursor:pointer}.amount.active{background:#4c1d95;border-color:var(--lav)}.panel,.notice{background:var(--panel);border:1px solid #302942;border-radius:13px;padding:16px}.notice{font-size:12px;color:#d8c7f0;line-height:1.5}.line{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin:10px 0}.line strong{color:#fff;text-align:right}.success{color:#22c55e;font-size:64px}@media(max-width:380px){.kiosk{padding:17px}h1{font-size:34px}}
</style></head><body><div class="kiosk"><header><div><b>BACOLOD CITY PAYMENT HUB</b><div style="color:#aaa;margin-top:5px;font-size:10px">SELF-SERVICE KIOSK</div></div><span style="color:#aaa">BACOLOD CITY, PH</span></header><main id="app"></main><footer><span>STUDENT DEMO · NO REAL PAYMENTS</span><span id="step">WELCOME</span></footer></div>
<script>
let s='welcome',service='',amount=100,payment='GCash',detail='';const app=document.querySelector('#app');function go(x){s=x;render()}function reset(){s='welcome';service='';amount=100;payment='GCash';detail='';render()}function primary(t,fn){return `<button class="btn primary" onclick="${fn}">${t} →</button>`}function back(x){return `<button class="btn ghost" onclick="go('${x}')">← Back</button>`}function money(n){return '₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}function render(){document.querySelector('#step').textContent=s.toUpperCase().replaceAll('-',' ');if(s==='welcome')app.innerHTML=`<div class="logo">B</div><div class="kicker">FAST · SIMPLE · CONVENIENT</div><h1>Welcome to<br><span style="color:#c084fc">Bacolod City.</span></h1><p>One convenient place for local self-service transactions.</p>${primary('START TRANSACTION',"go('language')")}<div class="notice">Services and sample destinations are limited to Bacolod City, Negros Occidental.</div>`;
if(s==='language')app.innerHTML=`<div class="kicker">STEP 01</div><h2>Select your language</h2><p>Choose your preferred language.</p>${['English','Filipino','Cebuano'].map(x=>`<button class="btn" onclick="this.parentNode.querySelectorAll('.btn').forEach(b=>b.style.borderColor='#38334c');this.style.borderColor='#c084fc'">${x}　›</button>`).join('')}${primary('CONTINUE',"go('menu')")}${back('welcome')}`;
if(s==='menu')app.innerHTML=`<div class="kicker">MAIN MENU</div><h1>What would you<br>like to do?</h1><p>Select a service to continue.</p><div class="grid"><button class="btn tile" onclick="service='Purchase Ticket';go('ticket')"><i>🎟️</i>Purchase Ticket<span class="sub">Buy a local ticket</span></button><button class="btn tile" onclick="service='Top Up Card';go('topup')"><i>💳</i>Top Up Card<span class="sub">Add card balance</span></button><button class="btn tile" onclick="service='Pay a Bill';go('bill')"><i>🧾</i>Pay a Bill<span class="sub">Pay a local bill</span></button><button class="btn tile" onclick="go('help')"><i>❔</i>Help & Support<span class="sub">Kiosk assistance</span></button></div>${back('welcome')}`;
if(s==='ticket')app.innerHTML=`<div class="kicker">PURCHASE TICKET</div><h2>Choose a destination</h2><p>Sample destinations within Bacolod City.</p><label class="field">Destination<select id="dest"><option>Bacolod Public Plaza</option><option>Bacolod City Government Center</option><option>SM City Bacolod</option></select></label><label class="field">Number of tickets<input id="qty" type="number" min="1" max="10" value="1"></label><div class="notice">Demo price: ₱50.00 per ticket.</div>${primary('CONTINUE',"detail=document.querySelector('#dest').value;amount=Math.max(1,Number(document.querySelector('#qty').value)||1)*50;go('method')")}${back('menu')}`;
if(s==='topup')app.innerHTML=`<div class="kicker">TOP UP CARD</div><h2>Add balance</h2><p>Choose an amount and enter a demo card number.</p><div class="amounts">${[50,100,200,500,1000].map(n=>`<button class="amount ${amount===n?'active':''}" onclick="amount=${n};render()">${n===1000?'₱1,000':'₱'+n}</button>`).join('')}</div><label class="field">Card number<input id="card" placeholder="Enter demo card number"></label>${primary('CONTINUE',"let c=document.querySelector('#card').value.trim();if(!c)alert('Enter a demo card number');else{detail='Card ending '+c.slice(-4);service='Top Up Card';go('method')}")}${back('menu')}`;
if(s==='bill')app.innerHTML=`<div class="kicker">PAY A BILL</div><h2>Bill information</h2><label class="field">Bill type<select id="provider"><option>Local Utility Bill (Demo)</option><option>City Service Fee (Demo)</option><option>Other Local Bill (Demo)</option></select></label><label class="field">Reference number<input id="ref" placeholder="e.g. BAC-123456"></label><label class="field">Amount to pay<input id="billamount" type="number" min="1" placeholder="Enter amount"></label>${primary('CONTINUE',"let r=document.querySelector('#ref').value.trim(),a=Number(document.querySelector('#billamount').value);if(!r||a<=0)alert('Enter a reference and valid amount');else{detail=document.querySelector('#provider').value+' · '+r;amount=a;service='Pay a Bill';go('method')}")}${back('menu')}`;
if(s==='method')app.innerHTML=`<div class="kicker">PAYMENT METHOD</div><h2>How would you like to pay?</h2><p>Select a demo payment method.</p>${['GCash','Maya','Credit / Debit Card','Cash (Demo)'].map(x=>`<button class="btn" onclick="payment='${x}';render()" style="border-color:${payment===x?'#c084fc':'#38334c'}">${x}<span style="float:right">${payment===x?'✓':'›'}</span></button>`).join('')}<div class="notice">No banks, e-wallets, or cash hardware are connected.</div>${primary('REVIEW PAYMENT',"go('review')")}${back(service==='Purchase Ticket'?'ticket':service==='Top Up Card'?'topup':'bill')}`;
if(s==='review')app.innerHTML=`<div class="kicker">REVIEW PAYMENT</div><h2>Confirm your details</h2><div class="panel"><div class="line"><span>Service</span><strong>${service}</strong></div><div class="line"><span>Details</span><strong>${detail}</strong></div><div class="line"><span>Method</span><strong>${payment}</strong></div><div class="line"><span>Total</span><strong style="color:#c084fc;font-size:21px">${money(amount)}</strong></div></div><div class="notice">Demo only. No money will be charged.</div>${primary('CONFIRM & PAY',"go('processing')")}${back('method')}`;
if(s==='processing')app.innerHTML=`<div class="logo">…</div><div class="kicker">PROCESSING</div><h2>Processing payment</h2><p>This screen simulates a payment process.</p>${primary('SIMULATE SUCCESS',"go('success')")}<button class="btn ghost" onclick="go('failed')">Simulate failed payment</button>`;
if(s==='success')app.innerHTML=`<div class="success">✓</div><div class="kicker">TRANSACTION COMPLETE</div><h1>Payment<br><span style="color:#c084fc">successful!</span></h1><p>Your demo transaction is complete.</p><div class="panel"><div class="line"><span>Service</span><strong>${service}</strong></div><div class="line"><span>Amount</span><strong>${money(amount)}</strong></div><div class="line"><span>Method</span><strong>${payment}</strong></div><div class="line"><span>Reference</span><strong>BCPH-DEMO-001</strong></div></div>${primary('VIEW RECEIPT',"go('receipt')")}<button class="btn ghost" onclick="reset()">FINISH</button>`;
if(s==='failed')app.innerHTML=`<div class="kicker" style="color:#ef4444">TRANSACTION NOT COMPLETED</div><h2>Payment failed</h2><p>No real payment was attempted.</p>${primary('TRY AGAIN',"go('method')")}${back('menu')}`;
if(s==='receipt')app.innerHTML=`<div class="kicker">DEMO RECEIPT</div><h2>Transaction receipt</h2><div class="panel"><div style="text-align:center;color:#c084fc;font-weight:bold">BACOLOD CITY PAYMENT HUB</div><div class="line"><span>Reference</span><strong>BCPH-DEMO-001</strong></div><div class="line"><span>Service</span><strong>${service}</strong></div><div class="line"><span>Details</span><strong>${detail}</strong></div><div class="line"><span>Method</span><strong>${payment}</strong></div><div class="line"><span>Amount</span><strong>${money(amount)}</strong></div><div class="line"><span>Status</span><strong style="color:#22c55e">DEMO SUCCESS</strong></div></div><div class="notice">This is not proof of a real payment.</div><button class="btn" onclick="window.print()">PRINT / SAVE RECEIPT</button>${primary('FINISH',"reset()")}`;
if(s==='help')app.innerHTML=`<div class="kicker">HELP & SUPPORT</div><h2>Need assistance?</h2><p>This student prototype demonstrates a possible self-service kiosk for Bacolod City.</p>${primary('RETURN TO MENU',"go('menu')")}${back('welcome')}`;}render();
</script></body></html>
